name: Backend CI
on:
  push:
    branches: [main, develop/backend]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate scheduled backup script
        run: |
          bash -n scripts/backup-scheduled.sh
          if env -u BACKUP_DIR -u DATABASE_PATH bash scripts/backup-scheduled.sh >/dev/null 2>&1; then
            echo 'Backup script must reject missing configuration' >&2
            exit 1
          fi
      - name: Run integration tests
        run: npm test
