name: Backend CI
on:
  push:
    branches: [main, develop/backend]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate scheduled backup script
        run: |
          bash -n scripts/backup-scheduled.sh
          if env -u BACKUP_DIR -u DATABASE_PATH bash scripts/backup-scheduled.sh >/dev/null 2>&1; then
            echo 'Backup script must reject missing configuration' >&2
            exit 1
          fi
      - name: Test scheduled backup and restored data
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          export DATABASE_PATH="$temp_dir/source.sqlite"
          export BACKUP_DIR="$temp_dir/backups"
          node --input-type=module -e "import Database from 'better-sqlite3'; const db=new Database(process.env.DATABASE_PATH); db.exec('CREATE TABLE backup_probe (value TEXT NOT NULL)'); db.prepare('INSERT INTO backup_probe (value) VALUES (?)').run('verified'); db.close()"
          bash scripts/backup-scheduled.sh
          backup_file="$(find "$BACKUP_DIR" -maxdepth 1 -name 'imperio-*.sqlite' -type f -print -quit)"
          test -n "$backup_file"
          BACKUP_FILE="$backup_file" node --input-type=module -e "import Database from 'better-sqlite3'; const db=new Database(process.env.BACKUP_FILE,{readonly:true,fileMustExist:true}); if(db.prepare('SELECT value FROM backup_probe').get()?.value!=='verified')process.exit(1); db.close()"
          test "$(stat -c '%a' "$backup_file")" = 600
          test "$(stat -c '%a' "$BACKUP_DIR")" = 700
          (
            flock -x 9
            if bash scripts/backup-scheduled.sh >"$temp_dir/locked.log" 2>&1; then
              echo 'Concurrent backup should fail when lock is held' >&2
              exit 1
            fi
            grep -q 'Outro backup já está em execução' "$temp_dir/locked.log"
          ) 9>"$BACKUP_DIR/.backup.lock"
          if BACKUP_DIR="$temp_dir" DATABASE_PATH="$temp_dir/source.sqlite" bash scripts/backup-scheduled.sh >/dev/null 2>&1; then
            echo 'Backup directory containing source database must be rejected' >&2
            exit 1
          fi
          if BACKUP_DIR="$temp_dir/backups/../" DATABASE_PATH="$temp_dir/source.sqlite" bash scripts/backup-scheduled.sh >/dev/null 2>&1; then
            echo 'Normalized backup directory containing source must be rejected' >&2
            exit 1
          fi
      - name: Run integration tests
        run: npm test
