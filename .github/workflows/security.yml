name: Security Audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar vulnerabilidades conhecidas de produção
        run: npm audit --omit=dev --audit-level=high
